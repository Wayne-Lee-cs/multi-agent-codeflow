[project]
name = "cagent"
version = "12.0.0"
description = "Concurrent agent workflow dispatcher — run multiple claude -p workers in parallel git worktrees"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Wayne Lee"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/waynelee/cagent"

[project.scripts]
cagent = "cagent.cli:main"

[project.optional-dependencies]
dev = ["mypy>=1.0", "pytest", "pytest-asyncio", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["cagent"]

[tool.coverage.report]
show_missing = true
fail_under = 78
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
