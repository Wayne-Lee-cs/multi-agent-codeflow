[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cagent"
version = "17.0.0"
description = "Concurrent agent workflow dispatcher — run multiple claude -p workers in parallel git worktrees"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Wayne Lee"}]
keywords = ["claude", "agent", "concurrency", "git-worktree", "automation", "ai", "orchestration", "dispatcher"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Wayne-Lee-cs/multi-agent-codeflow"
Repository = "https://github.com/Wayne-Lee-cs/multi-agent-codeflow"
Issues = "https://github.com/Wayne-Lee-cs/multi-agent-codeflow/issues"

[project.scripts]
cagent = "cagent.cli:main"

[project.optional-dependencies]
dev = ["mypy>=1.0", "pytest", "pytest-asyncio", "pytest-cov", "build"]

[tool.setuptools.packages.find]
include = ["cagent*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["cagent"]

[tool.coverage.report]
show_missing = true
fail_under = 78
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
